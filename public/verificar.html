<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verificar FreeTheAI</title>
<style>
  :root { color-scheme: dark light; --bg: #0b1511; --fg: #e8f3ee; --mut: #8fa89d; --ok: #6ee7a8; --bad: #ff8a8a; --card: #13231c; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4faf7; --fg: #10231a; --mut: #51675c; --ok: #0a7a45; --bad: #b3261e; --card: #e4f1ea; }
  }
  body { margin: 0 auto; max-width: 640px; padding: 24px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  p { color: var(--mut); margin: 0 0 16px; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--ok); color: #06140d; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #out { display: grid; gap: 10px; margin-top: 20px; }
  .row { background: var(--card); border-radius: 12px; padding: 12px 14px; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  code { font: 13px ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  ul { margin: 6px 0 0; padding-left: 18px; }
  summary { cursor: pointer; color: var(--mut); }
</style>
</head>
<body>
<h1>Verificar conexão com a FreeTheAI</h1>
<p>Testa se a chave do <code>config.js</code> funciona e mostra quais modelos de vídeo ela enxerga. Só consulta a lista de modelos; não cria vídeo.</p>
<button id="go" type="button">Testar agora</button>
<div id="out" aria-live="polite"></div>

<script src="config.js"></script>
<script>
(function () {
  var CFG = window.SORA_CONFIG || {};
  var BASE = String(CFG.baseUrl || 'https://api.freetheai.org').replace(/\/+$/, '');
  var out = document.getElementById('out');
  var btn = document.getElementById('go');

  var VIDEO_ID = /(^|[\/_.-])(video|veo|sora|kling|wan|hunyuanvideo|mochi|ltx|seedance|hailuo|cogvideox?|runway|pika|luma)([\/_.\d-]|$)/i;
  function looksLikeVideo(m) {
    if (!m || !m.id) return false;
    var mod = m.modalities;
    var parts = [m.type, m.kind, m.task, m.output_modalities, m.endpoints,
      mod && typeof mod === 'object' && !Array.isArray(mod) ? mod.output : mod];
    var meta = parts.map(function (v) { return v == null ? '' : (typeof v === 'string' ? v : JSON.stringify(v)); }).join(' ');
    return /video/i.test(meta) || VIDEO_ID.test(String(m.id));
  }

  function row(cls, text) {
    var d = document.createElement('div');
    d.className = 'row ' + cls;
    d.textContent = text;
    out.appendChild(d);
    return d;
  }

  function idList(parent, ids) {
    var ul = document.createElement('ul');
    ids.forEach(function (id) {
      var li = document.createElement('li');
      var c = document.createElement('code');
      c.textContent = id;
      li.appendChild(c);
      ul.appendChild(li);
    });
    parent.appendChild(ul);
  }

  async function run() {
    out.textContent = '';
    var key = String(CFG.apiKey || '').trim();
    if (!key || /COLE_SUA_CHAVE/i.test(key)) {
      row('bad', 'Falta colar a chave: abra o config.js, coloque-a em apiKey e publique de novo.');
      return;
    }
    row('ok', 'Chave encontrada no config.js.');

    var res;
    try {
      res = await fetch(BASE + '/v1/models', { headers: { Authorization: 'Bearer ' + key } });
    } catch (_) {
      row('bad', 'Não consegui falar com ' + BASE + ' a partir do navegador (internet, bloqueio CORS ou API fora do ar).');
      return;
    }
    if (res.status === 401) { row('bad', 'A FreeTheAI recusou a chave (401): inválida, revogada ou expirada.'); return; }
    if (res.status === 403) { row('bad', 'A FreeTheAI negou o acesso (403): confirme o e-mail, faça o check-in diário no site e veja as permissões da chave.'); return; }
    if (!res.ok) { row('bad', 'A FreeTheAI respondeu com erro ' + res.status + '.'); return; }

    var body = {};
    try { body = await res.json(); } catch (_) {}
    var list = (body && body.data) || [];
    row('ok', 'Chave aceita. A API listou ' + list.length + ' modelos para ela.');

    var videos = list.filter(looksLikeVideo).map(function (m) { return m.id; });
    if (videos.length) {
      var r = row('ok', 'Modelos de vídeo encontrados. Copie um ID para videoModel no config.js:');
      idList(r, videos.slice(0, 30));
    } else {
      row('bad', 'Nenhum modelo de vídeo encontrado para esta chave. Sem um modelo de vídeo liberado na sua conta, o site não consegue gerar vídeos. Confira freetheai.org/models.');
      if (list.length) {
        var d = document.createElement('details');
        d.className = 'row';
        var s = document.createElement('summary');
        s.textContent = 'Ver os primeiros modelos listados';
        d.appendChild(s);
        idList(d, list.slice(0, 40).map(function (m) { return m && m.id; }).filter(Boolean));
        out.appendChild(d);
      }
    }
  }

  btn.addEventListener('click', async function () {
    btn.disabled = true;
    try { await run(); } finally { btn.disabled = false; }
  });
})();
</script>
</body>
</html>
