    <script>
/* Perfil local de visitante (sem conta online). Roda antes do app. */
(function () {
  try {
    var profile = null;
    try { profile = JSON.parse(localStorage.getItem('nb.user')); } catch (_) {}
    if (!profile || typeof profile !== 'object') {
      profile = { name: 'Visitante', username: 'visitante', email: '', photoURL: '' };
    }
    if (!profile.id) {
      profile.id = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(16).slice(2);
    }
    localStorage.setItem('nb.user', JSON.stringify(profile));
    localStorage.setItem('nb.plan', JSON.stringify('free'));
  } catch (_) {}
})();

<script>
/* Sora 3 — geração de vídeo pela FreeTheAI (api.freetheai.org).
   A chave e o modelo vêm de config.js (window.SORA_CONFIG). */
(function () {
  'use strict';

  var CFG = window.SORA_CONFIG || {};
  var BASE = String(CFG.baseUrl || 'https://api.freetheai.org').replace(/\/+$/, '');
  var POLL_MS = (Number(CFG.pollSeconds) > 0 ? Number(CFG.pollSeconds) : 4) * 1000;
  var MAX_WAIT_MS = (Number(CFG.maxWaitMinutes) > 0 ? Number(CFG.maxWaitMinutes) : 20) * 60 * 1000;
  var SIZES = Object.assign({
    '9:16-720p': '720x1280',
    '16:9-720p': '1280x720',
    '9:16-1080p': '1080x1920',
    '16:9-1080p': '1920x1080'
  }, CFG.sizes || {});
  var discoveredModel = '';

  function sleep(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

  function apiKey() {
    var key = String(CFG.apiKey || '').trim();
    if (!key || /COLE_SUA_CHAVE/i.test(key)) {
      throw new Error('Falta a chave da FreeTheAI. Cole-a em apiKey no arquivo config.js e publique de novo.');
    }
    return key;
  }

  // Transforma uma resposta de erro da API numa mensagem em português.
  async function toError(res) {
    var detail = '';
    var code = '';
    try {
      var data = await res.clone().json();
      if (data && data.error) {
        detail = String(data.error.message || '');
        code = String(data.error.code || '');
      }
    } catch (_) {}
    var msg;
    switch (res.status) {
      case 400:
        msg = code === 'content_filter'
          ? 'O provedor recusou este prompt pelo filtro de conteúdo. Reescreva a descrição e tente de novo.'
          : 'A FreeTheAI recusou o pedido' + (detail ? ': ' + detail : '. Confira modelo, tamanho e duração no config.js.');
        break;
      case 401: msg = 'Chave da FreeTheAI inválida ou revogada. Confira o apiKey no config.js.'; break;
      case 402: msg = 'Saldo insuficiente na FreeTheAI para este modelo pago.'; break;
      case 403: msg = 'A FreeTheAI negou o acesso: confirme o e-mail, faça o check-in diário no site e veja as permissões da chave.'; break;
      case 404: msg = 'Modelo não encontrado. Confira o videoModel no config.js (ID exato de freetheai.org/models).'; break;
      case 413: msg = 'Pedido grande demais para a FreeTheAI.'; break;
      case 429: msg = 'Limite da FreeTheAI atingido (pedidos simultâneos ou cota do dia). Aguarde e tente de novo.'; break;
      case 502: msg = 'O provedor falhou ao gerar.' + (detail ? ' ' + detail : '') + ' Tente de novo.'; break;
      case 503: msg = 'O provedor está lotado ou fora do ar agora. Tente de novo em instantes.'; break;
      default: msg = 'Erro ' + res.status + ' da FreeTheAI' + (detail ? ': ' + detail : '.');
    }
    var err = new Error(msg);
    err.status = res.status;
    return err;
  }

  // Chamada autenticada à API. Só envia a chave para o endereço da própria FreeTheAI.
  async function api(path, init) {
    init = init || {};
    var headers = Object.assign({ Authorization: 'Bearer ' + apiKey() }, init.headers || {});
    var res;
    try {
      res = await fetch(BASE + path, Object.assign({}, init, { headers: headers }));
    } catch (_) {
      var netErr = new Error('Não consegui falar com a FreeTheAI (internet, bloqueio do navegador ou API fora do ar).');
      netErr.network = true;
      throw netErr;
    }
    if (!res.ok) throw await toError(res);
    return res;
  }

  // Heurística para achar modelos de vídeo na lista GET /v1/models (usada só se videoModel estiver vazio).
  var VIDEO_ID = /(^|[\/_.-])(video|veo|sora|kling|wan|hunyuanvideo|mochi|ltx|seedance|hailuo|cogvideox?|runway|pika|luma)([\/_.\d-]|$)/i;
  function looksLikeVideo(m) {
    if (!m || !m.id) return false;
    var mod = m.modalities;
    var parts = [m.type, m.kind, m.task, m.output_modalities, m.endpoints,
      mod && typeof mod === 'object' && !Array.isArray(mod) ? mod.output : mod];
    var meta = parts.map(function (v) {
      return v == null ? '' : (typeof v === 'string' ? v : JSON.stringify(v));
    }).join(' ');
    return /video/i.test(meta) || VIDEO_ID.test(String(m.id));
  }

  async function pickModel(request) {
    var wantsPro = request.model === 'nimbopro';
    var configured = (wantsPro && String(CFG.videoModelPro || '').trim()) || String(CFG.videoModel || '').trim();
    if (configured) return configured;
    if (discoveredModel) return discoveredModel;
    var body = await (await api('/v1/models')).json();
    var found = ((body && body.data) || []).filter(looksLikeVideo)[0];
    if (!found) {
      throw new Error('Sua chave da FreeTheAI não lista nenhum modelo de vídeo. Abra verificar.html para conferir e coloque o ID em videoModel no config.js.');
    }
    discoveredModel = found.id;
    return discoveredModel;
  }

  function sizeFor(request) {
    var key = (request.aspectRatio || '9:16') + '-' + (request.resolution || '720p');
    return SIZES[key] || SIZES['9:16-720p'];
  }

  function taskError(task) {
    var e = task && task.error;
    var msg = typeof e === 'string' ? e : (e && (e.message || e.code));
    return 'A geração falhou na FreeTheAI' + (msg ? ': ' + msg : '.');
  }

  // Baixa o MP4 (precisa da chave) e devolve um endereço blob: que o <video> consegue tocar.
  async function downloadVideo(task, id) {
    var target = BASE + '/v1/videos/' + encodeURIComponent(id) + '/content';
    var sendKey = true;
    if (task.content_url) {
      try {
        var u = new URL(task.content_url, BASE + '/');
        target = u.href;
        sendKey = u.origin === new URL(BASE).origin; // nunca manda a chave para outro domínio
      } catch (_) {}
    }
    var lastError = null;
    for (var attempt = 0; attempt < 3; attempt++) {
      if (attempt) await sleep(3000);
      var res = null;
      try {
        res = await fetch(target, sendKey ? { headers: { Authorization: 'Bearer ' + apiKey() } } : {});
      } catch (_) {
        lastError = new Error('O vídeo ficou pronto, mas não consegui baixá-lo (rede). Tente de novo.');
        continue;
      }
      if (res.ok) {
        var blob = await res.blob();
        if (!blob.size) throw new Error('A FreeTheAI devolveu um arquivo de vídeo vazio.');
        if (!/^video\//.test(blob.type)) blob = new Blob([blob], { type: 'video/mp4' });
        return URL.createObjectURL(blob);
      }
      lastError = await toError(res);
      if ([409, 502, 503].indexOf(res.status) === -1) break;
    }
    throw lastError;
  }

  async function createVideo(request, onStatus) {
    request = request || {};
    onStatus = typeof onStatus === 'function' ? onStatus : function () {};

    var prompt = String(request.prompt || '').trim();
    if (!prompt || prompt.length > 4000) throw new Error('Escreva um prompt de até 4.000 caracteres.');
    apiKey(); // falha cedo, com mensagem clara, se a chave não foi colada

    onStatus({ status: 'submitting' });
    var model = await pickModel(request);
    var created = await (await api('/v1/videos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: model,
        prompt: prompt,
        seconds: String(Number(request.durationSeconds) || 5),
        size: sizeFor(request)
      })
    })).json();
    if (!created || !created.id) throw new Error('A FreeTheAI não devolveu o número da tarefa. Tente de novo.');

    var id = created.id;
    var task = created;
    var startedAt = Date.now();
    var failures = 0;
    onStatus({ status: 'queued' });

    while (task.status !== 'completed') {
      if (task.status === 'failed') throw new Error(taskError(task));
      if (Date.now() - startedAt > MAX_WAIT_MS) {
        throw new Error('A geração passou de ' + Math.round(MAX_WAIT_MS / 60000) + ' minutos e foi interrompida. Tente de novo.');
      }
      await sleep(POLL_MS);
      try {
        task = await (await api('/v1/videos/' + encodeURIComponent(id))).json();
        failures = 0;
      } catch (e) {
        // A tarefa já existe: erros passageiros de rede/servidor não devem derrubar a espera.
        var transient = e.network || e.status === 429 || e.status >= 500;
        if (!transient || ++failures >= 4) throw e;
        continue;
      }
      if (task.status === 'in_progress') onStatus({ status: 'generating' });
      else if (task.status === 'queued') onStatus({ status: 'queued' });
    }

    onStatus({ status: 'saving' });
    var blobUrl = await downloadVideo(task, id);
    return { id: id, videoUrl: blobUrl, downloadUrl: blobUrl, interactionId: id };
  }

  window.soraBackend = { createVideo: createVideo };
})();
</script>
